{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5 mt-5">
        <div class="card bg-dark border-secondary">
            <div class="card-header border-secondary text-center py-4">
                <h2 class="mb-0 text-white">Sign In</h2>
                <p class="text-secondary mb-0">Welcome back to Code Lore</p>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label text-light">Username</label>
                        <input type="text" name="username" class="form-control bg-dark text-light border-secondary" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-light">Password</label>
                        <input type="password" name="password" class="form-control bg-dark text-light border-secondary" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Sign In</button>
                </form>
                <div class="mt-4 text-center">
                    <p class="text-secondary">Don't have an account? <a href="{{ url_for('signup') }}" class="text-primary text-decoration-none">Sign up</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
